services:
  app:
    build: .
    container_name: payment-processing-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://tsuser:tspass@postgres:5432/tsapp?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - payment_net

  postgres:
    image: postgres:16-alpine
    container_name: payment-processing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tsapp
      POSTGRES_USER: tsuser
      POSTGRES_PASSWORD: tspass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsuser -d tsapp"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - payment_net

  redis:
    image: redis:7-alpine
    container_name: payment-processing-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - payment_net

networks:
  payment_net:
    driver: bridge

volumes:
  postgres_data:
